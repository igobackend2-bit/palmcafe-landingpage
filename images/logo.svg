<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 155">
  <defs>
    <style>
      .pc-text {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 900;
        font-size: 90px;
        fill: #1a5216;
        letter-spacing: -2px;
      }
      .pc-sub {
        font-family: Arial, 'Helvetica Neue', sans-serif;
        font-weight: 500;
        font-size: 13.5px;
        fill: #1a1a1a;
        letter-spacing: 5px;
      }
    </style>
  </defs>

  <!-- ── PALM TREE (maroon, sits above the "l") ── -->
  <!-- Trunk — curves slightly left, ends at ~x=130,y=118 matching top of 'l' stroke -->
  <path d="M130 118 C129 102 128 86 126 68 C125 58 124 50 123 42"
        stroke="#8b1a1a" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Fronds radiating from crown at ~(123,42) -->
  <!-- Left long frond -->
  <path d="M123 42 C108 28 90 22 76 26"
        stroke="#8b1a1a" stroke-width="3.8" stroke-linecap="round" fill="none"/>
  <!-- Left mid frond -->
  <path d="M123 42 C112 32 100 28 92 34"
        stroke="#8b1a1a" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Center-left upward -->
  <path d="M123 42 C118 28 118 14 120 5"
        stroke="#8b1a1a" stroke-width="3.8" stroke-linecap="round" fill="none"/>
  <!-- Center-right upward -->
  <path d="M123 42 C128 28 132 14 134 6"
        stroke="#8b1a1a" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Right mid frond -->
  <path d="M123 42 C132 30 144 26 154 30"
        stroke="#8b1a1a" stroke-width="3.8" stroke-linecap="round" fill="none"/>
  <!-- Right long frond -->
  <path d="M123 42 C136 34 150 32 160 38"
        stroke="#8b1a1a" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Far right -->
  <path d="M123 42 C138 38 152 40 158 48"
        stroke="#8b1a1a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Frond tip dots -->
  <circle cx="76"  cy="26" r="4"   fill="#8b1a1a"/>
  <circle cx="92"  cy="34" r="3.2" fill="#8b1a1a"/>
  <circle cx="120" cy="5"  r="4"   fill="#8b1a1a"/>
  <circle cx="134" cy="6"  r="3.2" fill="#8b1a1a"/>
  <circle cx="154" cy="30" r="4"   fill="#8b1a1a"/>
  <circle cx="160" cy="38" r="3.2" fill="#8b1a1a"/>
  <circle cx="158" cy="48" r="2.8" fill="#8b1a1a"/>

  <!-- ── "Palmcafe" TEXT ── -->
  <text x="8" y="120" class="pc-text">Palmcafe</text>

  <!-- ── SUBTITLE ── -->
  <text x="250" y="145" class="pc-sub" text-anchor="middle">THE HEALTHY FOOD JOINT</text>
</svg>
