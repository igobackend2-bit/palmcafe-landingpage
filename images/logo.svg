<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <!-- Palm Tree (maroon, above the "l" in Palm) -->
  <g transform="translate(118, 8)">
    <!-- Trunk -->
    <path d="M18 110 C17 90 16 70 14 52" stroke="#8b1a1a" stroke-width="5.5" stroke-linecap="round" fill="none"/>
    <!-- Main fronds -->
    <path d="M14 52 C4 38 -10 32 -20 36" stroke="#8b1a1a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M14 52 C8 36 10 20 14 10" stroke="#8b1a1a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M14 52 C20 36 30 26 40 28" stroke="#8b1a1a" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M14 52 C22 40 38 36 46 40" stroke="#8b1a1a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M14 52 C4 42 -8 42 -14 48" stroke="#8b1a1a" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M14 52 C16 38 24 28 30 22" stroke="#8b1a1a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M14 52 C10 38 4 28 2 18" stroke="#8b1a1a" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Frond tips (filled circles) -->
    <circle cx="-20" cy="36" r="3.5" fill="#8b1a1a"/>
    <circle cx="14"  cy="10" r="3.5" fill="#8b1a1a"/>
    <circle cx="40"  cy="28" r="3.5" fill="#8b1a1a"/>
    <circle cx="46"  cy="40" r="3"   fill="#8b1a1a"/>
    <circle cx="-14" cy="48" r="3"   fill="#8b1a1a"/>
    <circle cx="30"  cy="22" r="2.5" fill="#8b1a1a"/>
    <circle cx="2"   cy="18" r="2.5" fill="#8b1a1a"/>
  </g>

  <!-- "Palmcafe" text -->
  <text
    x="14" y="128"
    font-family="'Trebuchet MS', 'Arial Rounded MT Bold', Arial, sans-serif"
    font-size="86"
    font-weight="900"
    fill="#1a5216"
    letter-spacing="-2"
  >Palmcafe</text>

  <!-- Subtitle -->
  <text
    x="260" y="152"
    font-family="'Trebuchet MS', Arial, sans-serif"
    font-size="15"
    font-weight="500"
    fill="#1a1a1a"
    letter-spacing="5"
    text-anchor="middle"
  >THE HEALTHY FOOD JOINT</text>
</svg>
